<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quest App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app {
      display: none;
      text-align: center;
      padding: 2rem;
    }

    body.is-fullscreen #app {
      display: block;
    }

    #controls-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    body.is-fullscreen #controls-container {
      display: none;
    }

    .btn {
      padding: 1rem 2rem;
      font-size: 1.15rem;
      font-weight: 600;
      border: none;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
      min-width: 240px;
    }

    .btn-fullscreen {
      color: #0f172a;
      background: #38bdf8;
      box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.4);
    }

    .btn-fullscreen:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }

    .btn-mobile {
      color: #f8fafc;
      background: #334155;
      border: 1px solid #475569;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .btn-mobile:hover {
      background: #475569;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Tlačítka zobrazená mimo fullscreen -->
  <div id="controls-container">
    <button id="fullscreen-btn" class="btn btn-fullscreen">Fullscreen</button>
    <button id="mobile-window-btn" class="btn btn-mobile">📱 Mobilní okno (390×844)</button>
  </div>

  <!-- Obsah aplikace zobrazený ve fullscreenu -->
  <main id="app">
    <h1>Quest App</h1>
    <p>Aplikace běží ve fullscreen režimu.</p>
  </main>

  <script>
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const mobileWindowBtn = document.getElementById('mobile-window-btn');

    function updateFullscreenState() {
      const isFs = Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );

      if (isFs) {
        document.body.classList.add('is-fullscreen');
      } else {
        document.body.classList.remove('is-fullscreen');
      }
    }

    async function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {
        console.error('Fullscreen request failed:', err);
      }
    }

    function openMobileWindow() {
      const width = 390;
      const height = 844;
      const left = Math.max(0, Math.round((window.screen.width - width) / 2));
      const top = Math.max(0, Math.round((window.screen.height - height) / 2));

      window.open(
        window.location.href,
        'QuestAppMobile',
        `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes,status=no`
      );
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);
    mobileWindowBtn.addEventListener('click', openMobileWindow);

    ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
      document.addEventListener(evt, updateFullscreenState);
    });

    updateFullscreenState();
  </script>
</body>
</html>
